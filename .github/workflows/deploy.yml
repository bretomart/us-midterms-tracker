name: Deploy dashboard to Pages

# GitHub Pages serves files and runs no Python, so the published site ships a
# baseline snapshot for structure, baseline seat counts, and fallback data.
#
# The page itself polls civicAPI directly in the visitor's browser for live
# race tallies, so data freshness no longer depends on continuous rebuilds.
# This workflow runs on pushes to main and every 6 hours as a fallback refresh.

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Fallback refresh. Rebuilding every 5 minutes is unnecessary because the
    # page reads live results directly from civicAPI in the visitor's browser.
    - cron: "0 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. The starter template keeps in-progress runs, and
# that is the safe setting for a live deployment.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Run the tests
        run: python3 -m unittest discover -v

      - name: Build the static snapshot
        run: python3 export_static.py --out dist

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
